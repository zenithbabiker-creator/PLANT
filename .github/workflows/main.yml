name: Android Build & Evaluation Workflow

on:
  push:
    branches: [ "main", "master" ]
  pull_request:
    branches: [ "main", "master" ]

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Java JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: Setup Node.js (for web-based mobile framework)
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Locate or Generate Gradle Project Files
        run: |
          # البحث عن المجلد الذي يحتوي على إعدادات Gradle
          PROJECT_DIR=$(find . -maxdepth 4 -name "settings.gradle" -o -name "settings.gradle.kts" | head -n 1 | xargs dirname 2>/dev/null)

          if [ -z "$PROJECT_DIR" ]; then
            echo "No existing settings.gradle found. Determining target folder..."
            if [ -d "android" ]; then
              PROJECT_DIR="android"
            else
              PROJECT_DIR="."
            fi

            echo "Generating build.gradle and settings.gradle automatically in $PROJECT_DIR..."
            mkdir -p "$PROJECT_DIR"

            # 1. توليد ملف settings.gradle
            cat << 'EOF' > "$PROJECT_DIR/settings.gradle"
          pluginManagement {
              repositories {
                  google()
                  mavenCentral()
                  gradlePluginPortal()
              }
          }
          dependencyResolutionManagement {
              repositoriesMode.set(RepositoriesMode.FAIL_ON_PROJECT_REPOS)
              repositories {
                  google()
                  mavenCentral()
              }
          }
          rootProject.name = "PlantApp"
          include ':app'
          EOF

            # 2. توليد ملف build.gradle الرئيسي على مستوى المشروع
            cat << 'EOF' > "$PROJECT_DIR/build.gradle"
          buildscript {
              repositories {
                  google()
                  mavenCentral()
              }
              dependencies {
                  classpath 'com.android.tools.build:gradle:8.2.2'
              }
          }
          plugins {
              id 'com.android.application' version '8.2.2' apply false
          }
          EOF

            # 3. التأكد من وجود مجلد app وملف build.gradle داخله
            mkdir -p "$PROJECT_DIR/app"
            if [ ! -f "$PROJECT_DIR/app/build.gradle" ]; then
              cat << 'EOF' > "$PROJECT_DIR/app/build.gradle"
          plugins {
              id 'com.android.application'
          }

          android {
              namespace 'com.example.plantapp'
              compileSdk 34

              defaultConfig {
                  applicationId "com.example.plantapp"
                  minSdk 24
                  targetSdk 34
                  versionCode 1
                  versionName "1.0"
              }

              compileOptions {
                  sourceCompatibility JavaVersion.VERSION_17
                  targetCompatibility JavaVersion.VERSION_17
              }
          }
          EOF
            fi
          fi

          echo "Android project located at: $PROJECT_DIR"
          echo "PROJECT_DIR=$PROJECT_DIR" >> $GITHUB_ENV

      - name: Verify or Initialize Gradle Wrapper
        run: |
          cd "$PROJECT_DIR"

          if [ ! -f "gradlew" ]; then
            echo "Gradle wrapper not found. Installing Gradle 8.5 and generating wrapper in $PROJECT_DIR..."
            wget https://services.gradle.org/distributions/gradle-8.5-bin.zip -P /tmp
            unzip -q /tmp/gradle-8.5-bin.zip -d /tmp
            /tmp/gradle-8.5/bin/gradle wrapper
          fi
          chmod +x gradlew

      - name: Check and Ensure Adaptive Icon
        run: |
          RES_DIR=$(find . -type d -path "*/src/main/res" | head -n 1)

          if [ -z "$RES_DIR" ]; then
            RES_DIR="$PROJECT_DIR/app/src/main/res"
          fi

          ICON_PATH="$RES_DIR/mipmap-anydpi-v26/ic_launcher.xml"
          
          if [ -f "$ICON_PATH" ]; then
            echo "Adaptive icon already exists at $ICON_PATH."
          else
            echo "No adaptive icon found. Creating a default adaptive icon setup inside $RES_DIR..."
            
            mkdir -p "$RES_DIR/mipmap-anydpi-v26"
            mkdir -p "$RES_DIR/drawable"

            cat << 'EOF' > "$RES_DIR/drawable/ic_launcher_background.xml"
          <?xml version="1.0" encoding="utf-8"?>
          <vector xmlns:android="http://schemas.android.com/apk/res/android"
              android:width="108dp"
              android:height="108dp"
              android:viewportWidth="108"
              android:viewportHeight="108">
              <path
                  android:fillColor="#3DDC84"
                  android:pathData="0,0h108v108h-108z"/>
          </vector>
          EOF

            cat << 'EOF' > "$RES_DIR/drawable/ic_launcher_foreground.xml"
          <?xml version="1.0" encoding="utf-8"?>
          <vector xmlns:android="http://schemas.android.com/apk/res/android"
              android:width="108dp"
              android:height="108dp"
              android:viewportWidth="108"
              android:viewportHeight="108">
              <path
                  android:fillColor="#FFFFFF"
                  android:pathData="M54,36c-9.94,0 -18,8.06 -18,18s8.06,18 18,18 18,-8.06 18,-18 -8.06,-18 -18,-18z"/>
          </vector>
          EOF

            cat << 'EOF' > "$RES_DIR/mipmap-anydpi-v26/ic_launcher.xml"
          <?xml version="1.0" encoding="utf-8"?>
          <adaptive-icon xmlns:android="http://schemas.android.com/apk/res/android">
              <background android:drawable="@drawable/ic_launcher_background" />
              <foreground android:drawable="@drawable/ic_launcher_foreground" />
          </adaptive-icon>
          EOF

            echo "Default adaptive icon generated successfully at $RES_DIR."
          fi

      - name: Install Node Dependencies & Build Web Assets
        run: |
          if [ -f "package.json" ]; then
            npm install
            npm run build --if-present
          fi

      - name: Build Android Debug APK
        run: |
          cd "$PROJECT_DIR"
          ./gradlew assembleDebug --stacktrace

      - name: Upload APK Artifact for Evaluation
        uses: actions/upload-artifact@v4
        with:
          name: app-debug-apk
          path: "**/build/outputs/apk/debug/*.apk"

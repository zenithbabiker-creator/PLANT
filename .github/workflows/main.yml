name: Android Build & Evaluation Workflow

on:
  push:
    branches: [ "main", "master" ]
  pull_request:
    branches: [ "main", "master" ]

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Java JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: Setup Node.js (for web-based mobile framework)
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Verify or Initialize Gradle Wrapper
        run: |
          if [ ! -f "gradlew" ]; then
            echo "Gradle wrapper not found. Installing Gradle and generating wrapper..."
            sudo apt-get update && sudo apt-get install -y gradle
            gradle wrapper
          fi
          chmod +x gradlew

      - name: Check and Ensure Adaptive Icon
        run: |
          ICON_PATH="android/app/src/main/res/mipmap-anydpi-v26/ic_launcher.xml"
          
          if [ -f "$ICON_PATH" ]; then
            echo "Adaptive icon already exists at $ICON_PATH."
          else
            echo "No adaptive icon found. Creating a default adaptive icon setup..."
            
            # إنشاء المجلدات المطلوبة للأيقونات
            mkdir -p android/app/src/main/res/mipmap-anydpi-v26
            mkdir -p android/app/src/main/res/drawable

            # إنشاء خلفية الايقونة (Background Color/Vector)
            cat << 'EOF' > android/app/src/main/res/drawable/ic_launcher_background.xml
          <?xml version="1.0" encoding="utf-8"?>
          <vector xmlns:android="http://schemas.android.com/apk/res/android"
              android:width="108dp"
              android:height="108dp"
              android:viewportWidth="108"
              android:viewportHeight="108">
              <path
                  android:fillColor="#3DDC84"
                  android:pathData="0,0h108v108h-108z"/>
          </vector>
          EOF

            # إنشاء شكل الأيقونة الأمامي (Foreground Vector)
            cat << 'EOF' > android/app/src/main/res/drawable/ic_launcher_foreground.xml
          <?xml version="1.0" encoding="utf-8"?>
          <vector xmlns:android="http://schemas.android.com/apk/res/android"
              android:width="108dp"
              android:height="108dp"
              android:viewportWidth="108"
              android:viewportHeight="108">
              <path
                  android:fillColor="#FFFFFF"
                  android:pathData="M54,36c-9.94,0 -18,8.06 -18,18s8.06,18 18,18 18,-8.06 18,-18 -8.06,-18 -18,-18z"/>
          </vector>
          EOF

            # إنشاء ملف الأيقونة التكيفية الرئيسي (Adaptive Icon Template)
            cat << 'EOF' > android/app/src/main/res/mipmap-anydpi-v26/ic_launcher.xml
          <?xml version="1.0" encoding="utf-8"?>
          <adaptive-icon xmlns:android="http://schemas.android.com/apk/res/android">
              <background android:drawable="@drawable/ic_launcher_background" />
              <foreground android:drawable="@drawable/ic_launcher_foreground" />
          </adaptive-icon>
          EOF

            echo "Default adaptive icon generated successfully."
          fi

      - name: Install Node Dependencies & Build Web Assets
        run: |
          if [ -f "package.json" ]; then
            npm install
            npm run build --if-present
          fi

      - name: Build Android Debug APK
        run: ./gradlew assembleDebug --stacktrace

      - name: Upload APK Artifact for Evaluation
        uses: actions/upload-artifact@v4
        with:
          name: app-debug-apk
          path: android/app/build/outputs/apk/debug/app-debug.apk
